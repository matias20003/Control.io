<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Tile azul de marca con una sola "c": a tamaño de pestaña (16px) cuatro
       caracteres no se leen; una inicial grande sí. -->
  <rect width="64" height="64" rx="14" fill="#2563EB"/>
  <text
    x="50%"
    y="50%"
    fill="#ffffff"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="46"
    font-weight="600"
    text-anchor="middle"
    dominant-baseline="central"
  >c</text>
</svg>
