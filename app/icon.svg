<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Velocímetro de marca: gauge azul sobre tile oscuro. Geometría amplia
       (arco grande, trazos gruesos) para que se lea incluso a 24-32px. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b2740"/>
      <stop offset="1" stop-color="#0e1626"/>
    </linearGradient>
    <linearGradient id="gauge" x1="16" y1="49" x2="48" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#7cb8ff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <path d="M 18 47 A 20 20 0 1 1 46 47" fill="none" stroke="#27324d" stroke-width="7" stroke-linecap="round"/>
  <path d="M 18 47 A 20 20 0 1 1 46 47" fill="none" stroke="url(#gauge)" stroke-width="7" stroke-linecap="round" stroke-dasharray="72 240"/>
  <line x1="32" y1="33" x2="21" y2="22" stroke="#cfe2ff" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="32" cy="33" r="4.2" fill="#0e1626" stroke="#5b9bff" stroke-width="2.2"/>
  <circle cx="32" cy="33" r="1.5" fill="#cfe2ff"/>
</svg>
