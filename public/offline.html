<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sin conexión — control.io</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: #ffffff;
      color: #0f172a;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card { max-width: 320px; }
    .logo {
      width: 64px; height: 64px; border-radius: 16px;
      background: #2563EB; color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 38px; font-weight: 600; margin: 0 auto 1.25rem;
    }
    h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
    p { color: #64748b; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.5rem; }
    button {
      background: #2563EB; color: #fff; border: none;
      padding: 0.75rem 1.5rem; border-radius: 12px;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
      font-family: inherit;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">c</div>
    <h1>Sin conexión</h1>
    <p>No pudimos cargar control.io. Revisá tu internet y volvé a intentar.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
