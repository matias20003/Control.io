<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Control.io Focus</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        align-items: center;
        background: #f8fafc;
        color: #0f172a;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      main {
        padding: 32px;
        text-align: center;
      }

      span {
        animation: pulse 900ms ease-in-out infinite alternate;
        background: #2563eb;
        border-radius: 999px;
        display: inline-block;
        height: 12px;
        width: 12px;
      }

      p {
        color: #64748b;
        font-size: 14px;
        margin: 14px 0 0;
      }

      @keyframes pulse {
        to {
          opacity: 0.35;
          transform: scale(0.78);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <span aria-hidden="true"></span>
      <p>Preparando tu sesión enfocada…</p>
    </main>
  </body>
</html>
